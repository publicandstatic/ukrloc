<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Steam ігри з українською</title>

    <style>
        :root {
            --bg: #0d1520;
            --panel: #141f2e;
            --panel-alt: #182636;
            --border: #24374d;
            --text: #dce6f0;
            --text-dim: #7c93ab;
            --accent: #5ba8d4;
            --accent-soft: rgba(91, 168, 212, 0.12);
            --gold: #e3b341;
            --radius: 10px;

            --mono:
                'IBM Plex Mono',
                'JetBrains Mono',
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;

            --sans:
                'Inter',
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background:
                radial-gradient(
                    1200px 500px at 15% -10%,
                    rgba(91, 168, 212, 0.08),
                    transparent 60%
                ),
                var(--bg);

            color: var(--text);
            font-family: var(--sans);

            padding: 40px 24px 60px;
        }

        .wrap {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }

        /* ---------------------------------------------------------- */
        /* TOOLBAR */
        /* ---------------------------------------------------------- */

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 24px 0 14px;

            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 260px;

            display: flex;
            align-items: center;

            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            padding: 10px 14px;
        }

        .search input {
            background: none;

            border: none;
            outline: none;

            color: var(--text);

            font-family: var(--sans);
            font-size: 14px;

            width: 100%;
        }

        .search input::placeholder {
            color: var(--text-dim);
        }

        /* ---------------------------------------------------------- */
        /* TRI STATE FILTER */
        /* ---------------------------------------------------------- */

        .tri-filter {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 13px;
            color: var(--text-dim);
            font-family: var(--mono);

            white-space: nowrap;
        }

        .tri-filter-label {
            font-size: 13px;
        }

        .tri-filter-options {
            display: inline-flex;

            border: 1px solid var(--border);
            border-radius: 6px;

            overflow: hidden;
        }

        .tri-filter-options button {
            background: var(--panel);

            border: none;
            border-right: 1px solid var(--border);

            color: var(--text-dim);

            padding: 6px 9px;

            font-family: var(--mono);
            font-size: 12px;

            cursor: pointer;
        }

        .tri-filter-options button:last-child {
            border-right: none;
        }

        .tri-filter-options button:hover {
            background: var(--accent-soft);
            color: var(--text);
        }

        .tri-filter-options button.active {
            background: var(--accent);
            color: var(--bg);
        }

        /* ---------------------------------------------------------- */
        /* OTHER FILTERS */
        /* ---------------------------------------------------------- */

        .filter-group {
            display: flex;
            align-items: center;

            gap: 8px;

            font-size: 13px;
            color: var(--text-dim);
            font-family: var(--mono);

            white-space: nowrap;
        }

        .filter-group input[type='number'] {
            width: 60px;

            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: 6px;

            color: var(--text);

            padding: 6px 8px;

            font-family: var(--mono);
            font-size: 13px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 13px;
            color: var(--text-dim);
            font-family: var(--mono);

            cursor: pointer;

            user-select: none;
            white-space: nowrap;
        }

        .checkbox-group:hover {
            color: var(--text);
        }

        .checkbox-group input[type='checkbox'] {
            width: 15px;
            height: 15px;

            accent-color: var(--accent);

            cursor: pointer;
        }

        .page-size {
            display: flex;
            align-items: center;

            gap: 8px;

            font-size: 13px;
            color: var(--text-dim);
            font-family: var(--mono);
        }

        .page-size select {
            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: 6px;

            color: var(--text);

            padding: 6px 8px;

            font-family: var(--mono);
            font-size: 13px;
        }

        /* ---------------------------------------------------------- */
        /* TABLE */
        /* ---------------------------------------------------------- */

        .table-card {
            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;

            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;

            color: var(--text-dim);

            padding: 14px 16px;

            background: var(--panel-alt);

            border-bottom: 1px solid var(--border);

            cursor: pointer;
            user-select: none;

            white-space: nowrap;
        }

        thead th:hover {
            color: var(--text);
        }

        thead th.num {
            text-align: right;
        }

        .th-inner {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .arrow {
            font-size: 10px;
            opacity: 0.35;

            font-family: var(--mono);
        }

        thead th.active .arrow {
            opacity: 1;
            color: var(--accent);
        }

        tbody td {
            padding: 13px 16px;

            border-bottom: 1px solid var(--border);

            font-size: 14px;

            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--accent-soft);
        }

        td.num {
            font-family: var(--mono);
            font-size: 13px;

            color: var(--text-dim);

            text-align: right;
        }

        .rec-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 6px;
        }

        .rec-value {
            font-family: var(--mono);
            font-weight: 600;

            color: var(--gold);
        }

        .game-link {
            color: var(--text);

            text-decoration: none;
            font-weight: 600;

            border-bottom: 1px solid transparent;

            transition:
                color 0.15s,
                border-color 0.15s;
        }

        .game-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ---------------------------------------------------------- */
        /* EMPTY / LOADING */
        /* ---------------------------------------------------------- */

        .empty,
        .loading {
            padding: 48px 16px;

            text-align: center;

            color: var(--text-dim);

            font-family: var(--mono);
            font-size: 13px;
        }

        /* ---------------------------------------------------------- */
        /* FOOTER */
        /* ---------------------------------------------------------- */

        .footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            margin-top: 16px;

            flex-wrap: wrap;

            font-size: 13px;
            color: var(--text-dim);
            font-family: var(--mono);
        }

        .pager {
            display: flex;
            align-items: center;

            gap: 6px;
        }

        .pager button {
            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: 6px;

            color: var(--text);

            padding: 6px 10px;

            font-family: var(--mono);
            font-size: 13px;

            cursor: pointer;

            transition:
                background 0.15s,
                color 0.15s;
        }

        .pager button:hover:not(:disabled) {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .pager button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .pager button.active {
            background: var(--accent);
            color: var(--bg);

            border-color: var(--accent);
        }

        .pager .gap {
            padding: 0 4px;
            opacity: 0.5;
        }
    </style>
</head>

<body>

<div class="wrap">

    <header>
        <h1>Steam ігри з українською</h1>
    </header>

    <!-- ========================================================== -->
    <!-- FILTERS -->
    <!-- ========================================================== -->

    <div class="toolbar">

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="Пошук за назвою..."
            />
        </div>

        <!-- RELEASE -->

        <div class="tri-filter">

            <span class="tri-filter-label">
                Реліз:
            </span>

            <div
                class="tri-filter-options"
                data-filter="release"
            >

                <button
                    type="button"
                    data-value="any"
                    class="active"
                >
                    —
                </button>

                <button
                    type="button"
                    data-value="released"
                >
                    Вийшли
                </button>

                <button
                    type="button"
                    data-value="unreleased"
                >
                    Ще не вийшли
                </button>

            </div>

        </div>

        <!-- INTERFACE -->

        <div class="tri-filter">

            <span class="tri-filter-label">
                Текст:
            </span>

            <div
                class="tri-filter-options"
                data-filter="interface"
            >

                <button
                    type="button"
                    data-value="any"
                    class="active"
                >
                    —
                </button>

                <button
                    type="button"
                    data-value="yes"
                >
                    Так
                </button>

                <button
                    type="button"
                    data-value="no"
                >
                    Ні
                </button>

            </div>

        </div>

        <!-- SUBTITLES -->

        <div class="tri-filter">

            <span class="tri-filter-label">
                Субтитри:
            </span>

            <div
                class="tri-filter-options"
                data-filter="subtitles"
            >

                <button
                    type="button"
                    data-value="any"
                    class="active"
                >
                    —
                </button>

                <button
                    type="button"
                    data-value="yes"
                >
                    Так
                </button>

                <button
                    type="button"
                    data-value="no"
                >
                    Ні
                </button>

            </div>

        </div>

        <!-- AUDIO -->

        <div class="tri-filter">

            <span class="tri-filter-label">
                Звук:
            </span>

            <div
                class="tri-filter-options"
                data-filter="audio"
            >

                <button
                    type="button"
                    data-value="any"
                    class="active"
                >
                    —
                </button>

                <button
                    type="button"
                    data-value="yes"
                >
                    Так
                </button>

                <button
                    type="button"
                    data-value="no"
                >
                    Ні
                </button>

            </div>

        </div>

        <!-- NO RU -->

        <label class="checkbox-group">

            <input
                id="noRuCheckbox"
                type="checkbox"
            />

            Без ru

        </label>

        <!-- MAX LOCALIZATIONS -->

        <div class="filter-group">

            Макс. локалізацій:

            <input
                id="maxLocInput"
                type="number"
                min="0"
                value="999"
            />

        </div>

        <!-- PAGE SIZE -->

        <div class="page-size">

            Рядків:

            <select id="pageSizeSelect">

                <option value="10">
                    10
                </option>

                <option
                    value="25"
                    selected
                >
                    25
                </option>

                <option value="50">
                    50
                </option>

                <option value="100">
                    100
                </option>

            </select>

        </div>

    </div>

    <!-- ========================================================== -->
    <!-- TABLE -->
    <!-- ========================================================== -->

    <div class="table-card">

        <table>

            <thead>
                <tr id="headerRow"></tr>
            </thead>

            <tbody id="tableBody">

                <tr>
                    <td
                        class="loading"
                        colspan="5"
                    >
                        Завантаження games.json...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <!-- ========================================================== -->
    <!-- FOOTER -->
    <!-- ========================================================== -->

    <div class="footer-bar">

        <div id="statusText">
            —
        </div>

        <div
            class="pager"
            id="pager"
        ></div>

    </div>

</div>

<script>

    // ==============================================================
    // COLUMNS
    // ==============================================================

    const COLUMNS = [
        {
            key: 'appid',
            label: 'AppID',
            type: 'num',
        },

        {
            key: 'name',
            label: 'Назва',
            type: 'text',
        },

        {
            key: 'release_date',
            label: 'Дата релізу',
            type: 'date',
        },

        {
            key: 'recommendations_total',
            label: 'Рецензії',
            type: 'num',
        },

        {
            key: 'reviews_per_day',
            label: 'Рец./день',
            type: 'num',
        },

        {
            key: 'localizations_count',
            label: 'Локалізацій',
            type: 'num',
        },
    ];


    // ==============================================================
    // STATE
    // ==============================================================

    let allGames = [];
    let filtered = [];

    let sortKey = 'recommendations_total';
    let sortDir = 'desc';

    let currentPage = 1;
    let pageSize = 25;


    const filterState = {

        release: 'any',

        interface: 'any',

        subtitles: 'any',

        audio: 'any',

    };


    // ==============================================================
    // ELEMENTS
    // ==============================================================

    const headerRow =
        document.getElementById(
            'headerRow'
        );

    const tableBody =
        document.getElementById(
            'tableBody'
        );

    const pagerEl =
        document.getElementById(
            'pager'
        );

    const statusText =
        document.getElementById(
            'statusText'
        );

    const searchInput =
        document.getElementById(
            'searchInput'
        );

    const pageSizeSelect =
        document.getElementById(
            'pageSizeSelect'
        );

    const maxLocInput =
        document.getElementById(
            'maxLocInput'
        );

    const noRuCheckbox =
        document.getElementById(
            'noRuCheckbox'
        );


    // ==============================================================
    // HEADER
    // ==============================================================

    function buildHeader() {

        headerRow.innerHTML = '';

        COLUMNS.forEach(
            (column) => {

                const th =
                    document.createElement(
                        'th'
                    );

                th.dataset.key =
                    column.key;

                if (
                    column.type === 'num'
                ) {
                    th.classList.add(
                        'num'
                    );
                }

                th.innerHTML = `
                    <span class="th-inner">

                        ${column.label}

                        <span class="arrow">
                            ${sortIndicator(column.key)}
                        </span>

                    </span>
                `;

                th.addEventListener(
                    'click',
                    () => {

                        if (
                            sortKey ===
                            column.key
                        ) {

                            sortDir =
                                sortDir === 'asc'
                                    ? 'desc'
                                    : 'asc';

                        } else {

                            sortKey =
                                column.key;

                            sortDir =
                                column.type === 'num'
                                    ? 'desc'
                                    : 'asc';

                        }

                        currentPage = 1;

                        applySort();

                        render();

                    }
                );

                if (
                    column.key ===
                    sortKey
                ) {

                    th.classList.add(
                        'active'
                    );

                }

                headerRow.appendChild(
                    th
                );

            }
        );

    }


    function sortIndicator(
        key
    ) {

        if (
            key !== sortKey
        ) {
            return '↕';
        }

        return (
            sortDir === 'asc'
                ? '↑'
                : '↓'
        );

    }


    // ==============================================================
    // SORT
    // ==============================================================

    function applySort() {
        const column =
            COLUMNS.find(
                (item) =>
                    item.key === sortKey
            );

        const direction =
            sortDir === 'asc'
                ? 1
                : -1;

        filtered.sort(
            (a, b) => {
                let valueA = a[sortKey];
                let valueB = b[sortKey];

                if (column.type === 'num') {
                    valueA = Number(valueA) || 0;
                    valueB = Number(valueB) || 0;

                    return (
                        valueA - valueB
                    ) * direction;
                }

                if (column.type === 'date') {
                    const timeA =
                        parseReleaseDate(valueA);

                    const timeB =
                        parseReleaseDate(valueB);

                    return (
                        timeA - timeB
                    ) * direction;
                }

                valueA =
                    (valueA ?? '')
                        .toString()
                        .toLowerCase();

                valueB =
                    (valueB ?? '')
                        .toString()
                        .toLowerCase();

                if (valueA < valueB) {
                    return -1 * direction;
                }

                if (valueA > valueB) {
                    return 1 * direction;
                }

                return 0;
            }
        );
    }


    // ==============================================================
    // LANGUAGE HELPERS
    // ==============================================================

    function hasLanguage(
        game,
        type,
        language
    ) {

        const languages =
            game.localizations?.[
                type
            ];

        if (
            !Array.isArray(
                languages
            )
        ) {
            return false;
        }

        const normalized =
            language.toLowerCase();

        return languages.some(
            (item) =>
                String(item)
                    .toLowerCase() ===
                normalized
        );

    }


    function hasAnyUkrainian(
        game
    ) {

        return (

            hasLanguage(
                game,
                'interface',
                'Ukrainian'
            )

            ||

            hasLanguage(
                game,
                'subtitles',
                'Ukrainian'
            )

            ||

            hasLanguage(
                game,
                'audio',
                'Ukrainian'
            )

        );

    }


    function hasRussianAnywhere(
        game
    ) {

        return (

            hasLanguage(
                game,
                'interface',
                'Russian'
            )

            ||

            hasLanguage(
                game,
                'subtitles',
                'Russian'
            )

            ||

            hasLanguage(
                game,
                'audio',
                'Russian'
            )

        );

    }


    // ==============================================================
    // LOCALIZATION FILTER
    // ==============================================================

    function matchesLocalizationFilter(
        game,
        type,
        state
    ) {

        if (
            state === 'any'
        ) {
            return true;
        }

        const hasUkrainian =
            hasLanguage(
                game,
                type,
                'Ukrainian'
            );


        if (
            state === 'yes'
        ) {
            return hasUkrainian;
        }


        if (
            state === 'no'
        ) {
            return !hasUkrainian;
        }


        return true;

    }


    // ==============================================================
    // RELEASE FILTER
    // ==============================================================


    function parseReleaseDate(value) {
        if (!value) {
            return 0;
        }

        const date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {
            return 0;
        }

        return date.getTime();
    }

    function formatReleaseDate(value) {
        if (!value) {
            return '—';
        }

        const date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {
            return value;
        }

        return date.toLocaleDateString(
            'uk-UA',
            {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
            }
        );
    }

    function getReleaseStatus(
        game
    ) {

        if (
            !game.release_date
        ) {
            return 'unreleased';
        }

        const releaseDate =
            new Date(
                game.release_date
            );


        if (
            isNaN(
                releaseDate.getTime()
            )
        ) {

            return 'unreleased';

        }


        if (
            releaseDate.getTime()
            <= Date.now()
        ) {

            return 'released';

        }


        return 'unreleased';

    }


    function matchesReleaseFilter(
        game,
        state
    ) {

        if (
            state === 'any'
        ) {
            return true;
        }

        return (
            getReleaseStatus(game)
            === state
        );

    }


    // ==============================================================
    // FILTER
    // ==============================================================

    function applyFilter() {

        const query =
            searchInput
                .value
                .trim()
                .toLowerCase();


        const maxLocalizations =
            Number(
                maxLocInput.value
            ) || 0;


        const noRussian =
            noRuCheckbox.checked;


        filtered =
            allGames.filter(
                (game) => {

                    // --------------------------------------------------
                    // Базове правило:
                    // показуємо тільки ігри,
                    // де є українська хоча б десь.
                    // --------------------------------------------------

                    if (
                        !hasAnyUkrainian(
                            game
                        )
                    ) {
                        return false;
                    }


                    // --------------------------------------------------
                    // SEARCH
                    // --------------------------------------------------

                    if (
                        query
                        &&
                        !(game.name || '')
                            .toLowerCase()
                            .includes(
                                query
                            )
                    ) {

                        return false;

                    }


                    // --------------------------------------------------
                    // MAX LOCALIZATIONS
                    // --------------------------------------------------

                    if (
                        (
                            game.localizations_count
                            || 0
                        )
                        >
                        maxLocalizations
                    ) {

                        return false;

                    }


                    // --------------------------------------------------
                    // RELEASE
                    // --------------------------------------------------

                    if (
                        !matchesReleaseFilter(
                            game,
                            filterState.release
                        )
                    ) {

                        return false;

                    }


                    // --------------------------------------------------
                    // INTERFACE
                    // --------------------------------------------------

                    if (
                        !matchesLocalizationFilter(
                            game,
                            'interface',
                            filterState.interface
                        )
                    ) {

                        return false;

                    }


                    // --------------------------------------------------
                    // SUBTITLES
                    // --------------------------------------------------

                    if (
                        !matchesLocalizationFilter(
                            game,
                            'subtitles',
                            filterState.subtitles
                        )
                    ) {

                        return false;

                    }


                    // --------------------------------------------------
                    // AUDIO
                    // --------------------------------------------------

                    if (
                        !matchesLocalizationFilter(
                            game,
                            'audio',
                            filterState.audio
                        )
                    ) {

                        return false;

                    }


                    // --------------------------------------------------
                    // NO RUSSIAN
                    // --------------------------------------------------

                    if (
                        noRussian
                        &&
                        hasRussianAnywhere(
                            game
                        )
                    ) {

                        return false;

                    }


                    return true;

                }
            );

    }


    // ==============================================================
    // NUMBERS
    // ==============================================================

    function formatNumber(
        value
    ) {

        if (
            value === null
            ||
            value === undefined
            ||
            value === ''
        ) {

            return '—';

        }

        return Number(
            value
        ).toLocaleString(
            'uk-UA'
        );

    }


    function formatDecimal(
        value
    ) {

        if (
            value === null
            ||
            value === undefined
            ||
            isNaN(value)
        ) {

            return '—';

        }

        return value.toLocaleString(
            'uk-UA',
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1,
            }
        );

    }


    // ==============================================================
    // REVIEWS PER DAY
    // ==============================================================

    function computeReviewsPerDay(
        game
    ) {

        if (
            !game.release_date
        ) {
            return null;
        }

        const releaseDate =
            new Date(
                game.release_date
            );


        if (
            isNaN(
                releaseDate.getTime()
            )
        ) {
            return null;
        }


        const rawDays =
            (
                Date.now()
                -
                releaseDate.getTime()
            )
            /
            (
                1000
                *
                60
                *
                60
                *
                24
            );


        if (
            rawDays < 0
        ) {
            return null;
        }


        const daysSinceRelease =
            Math.max(
                rawDays,
                1
            );


        const total =
            Number(
                game.recommendations_total
            ) || 0;


        return (
            total
            /
            daysSinceRelease
        );

    }


    // ==============================================================
    // STEAM URL
    // ==============================================================

    function steamUrl(
        appid,
        name
    ) {

        const slug =
            (name || '')
                .trim()
                .replace(
                    /[^a-zA-Z0-9]+/g,
                    '_'
                );

        return (
            `https://store.steampowered.com/app/${appid}/${encodeURIComponent(slug)}/`
        );

    }


    // ==============================================================
    // ESCAPE
    // ==============================================================

    function escapeHtml(
        value
    ) {

        const div =
            document.createElement(
                'div'
            );

        div.textContent =
            value;

        return div.innerHTML;

    }


    // ==============================================================
    // RENDER
    // ==============================================================

    function render() {

        buildHeader();


        const total =
            filtered.length;


        const totalPages =
            Math.max(
                1,
                Math.ceil(
                    total
                    /
                    pageSize
                )
            );


        if (
            currentPage >
            totalPages
        ) {

            currentPage =
                totalPages;

        }


        tableBody.innerHTML =
            '';


        if (
            total === 0
        ) {

            tableBody.innerHTML = `
                <tr>
                    <td
                        class="empty"
                        colspan="${COLUMNS.length}"
                    >
                        Нічого не знайдено
                    </td>
                </tr>
            `;

        } else {

            const start =
                (
                    currentPage - 1
                )
                *
                pageSize;


            const games =
                filtered.slice(
                    start,
                    start + pageSize
                );


            games.forEach(
                (game) => {

                    const row =
                        document.createElement(
                            'tr'
                        );


                    row.innerHTML = `

                        <td class="num">
                            ${game.appid}
                        </td>

                        <td>

                            <a
                                class="game-link"
                                href="${steamUrl(game.appid, game.name)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                ${escapeHtml(game.name || '')}
                            </a>

                        </td>

                        <td class="num">
                            ${formatReleaseDate(game.release_date)}
                        </td>

                        <td class="num">

                            <span class="rec-cell">

                                <span class="rec-value">
                                    ${formatNumber(game.recommendations_total)}
                                </span>

                            </span>

                        </td>

                        <td class="num">
                            ${formatDecimal(game.reviews_per_day)}
                        </td>

                        <td class="num">
                            ${game.localizations_count}
                        </td>

                    `;


                    tableBody.appendChild(
                        row
                    );

                }
            );

        }


        if (
            total === 0
        ) {

            statusText.textContent =
                '0 записів';

        } else {

            const first =
                (
                    currentPage - 1
                )
                *
                pageSize
                +
                1;


            const last =
                Math.min(
                    total,
                    currentPage
                    *
                    pageSize
                );


            statusText.textContent =
                `Показано ${first}–${last} з ${total}`;

        }


        renderPager(
            totalPages
        );

    }


    // ==============================================================
    // PAGER
    // ==============================================================

    function renderPager(
        totalPages
    ) {

        pagerEl.innerHTML =
            '';


        const previous =
            document.createElement(
                'button'
            );


        previous.textContent =
            '← Назад';


        previous.disabled =
            currentPage === 1;


        previous.addEventListener(
            'click',
            () => {

                currentPage--;

                render();

            }
        );


        pagerEl.appendChild(
            previous
        );


        const numbers =
            getPageNumbers(
                currentPage,
                totalPages
            );


        numbers.forEach(
            (page) => {

                if (
                    page === '...'
                ) {

                    const gap =
                        document.createElement(
                            'span'
                        );

                    gap.className =
                        'gap';

                    gap.textContent =
                        '…';

                    pagerEl.appendChild(
                        gap
                    );

                    return;

                }


                const button =
                    document.createElement(
                        'button'
                    );


                button.textContent =
                    page;


                if (
                    page ===
                    currentPage
                ) {

                    button.classList.add(
                        'active'
                    );

                }


                button.addEventListener(
                    'click',
                    () => {

                        currentPage =
                            page;

                        render();

                    }
                );


                pagerEl.appendChild(
                    button
                );

            }
        );


        const next =
            document.createElement(
                'button'
            );


        next.textContent =
            'Вперед →';


        next.disabled =
            currentPage ===
            totalPages;


        next.addEventListener(
            'click',
            () => {

                currentPage++;

                render();

            }
        );


        pagerEl.appendChild(
            next
        );

    }


    function getPageNumbers(
        current,
        total
    ) {

        const delta = 1;

        const range = [];


        for (
            let i =
                Math.max(
                    1,
                    current - delta
                );

            i <=
            Math.min(
                total,
                current + delta
            );

            i++
        ) {

            range.push(
                i
            );

        }


        if (
            range[0] > 1
        ) {

            range.unshift(
                '...'
            );

            range.unshift(
                1
            );

        }


        if (
            range[
                range.length - 1
            ] < total
        ) {

            range.push(
                '...'
            );

            range.push(
                total
            );

        }


        return range;

    }


    // ==============================================================
    // FILTER CHANGE
    // ==============================================================

    function filterChanged() {

        currentPage = 1;

        applyFilter();

        applySort();

        render();

    }


    // ==============================================================
    // TRI STATE BUTTONS
    // ==============================================================

    document
        .querySelectorAll(
            '.tri-filter-options'
        )
        .forEach(
            (group) => {

                const filterName =
                    group.dataset.filter;


                group
                    .querySelectorAll(
                        'button'
                    )
                    .forEach(
                        (button) => {

                            button.addEventListener(
                                'click',
                                () => {

                                    group
                                        .querySelectorAll(
                                            'button'
                                        )
                                        .forEach(
                                            (other) => {

                                                other.classList.remove(
                                                    'active'
                                                );

                                            }
                                        );


                                    button.classList.add(
                                        'active'
                                    );


                                    filterState[
                                        filterName
                                    ] =
                                        button.dataset.value;


                                    filterChanged();

                                }
                            );

                        }
                    );

            }
        );


    // ==============================================================
    // EVENTS
    // ==============================================================

    searchInput.addEventListener(
        'input',
        filterChanged
    );


    maxLocInput.addEventListener(
        'input',
        filterChanged
    );


    noRuCheckbox.addEventListener(
        'change',
        filterChanged
    );


    pageSizeSelect.addEventListener(
        'change',
        () => {

            pageSize =
                Number(
                    pageSizeSelect.value
                );

            currentPage = 1;

            render();

        }
    );


    // ==============================================================
    // LOAD JSON
    // ==============================================================

    fetch(
        'games.json'
    )

        .then(
            (response) => {

                if (
                    !response.ok
                ) {

                    throw new Error(
                        'HTTP '
                        +
                        response.status
                    );

                }

                return response.json();

            }
        )

        .then(
            (data) => {

                allGames =
                    data

                        .filter(
                            (game) =>
                                game.type ===
                                'game'
                        )

                        .map(
                            (game) => ({

                                ...game,


                                localizations_count:
                                    Array.isArray(
                                        game.localizations?.supported
                                    )
                                        ?
                                        game.localizations.supported.length
                                        :
                                        0,


                                reviews_per_day:
                                    computeReviewsPerDay(
                                        game
                                    ),

                            })
                        );


                applyFilter();

                applySort();

                render();

            }
        )

        .catch(
            (error) => {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            class="empty"
                            colspan="${COLUMNS.length}"
                        >

                            Не вдалося завантажити games.json
                            (${escapeHtml(error.message)}).

                        </td>

                    </tr>

                `;


                statusText.textContent =
                    'Помилка завантаження';

            }
        );

</script>

</body>
