<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Games UKR — каталог</title>
<style>
  :root{
    --bg: #0d1520;
    --panel: #141f2e;
    --panel-alt: #182636;
    --border: #24374d;
    --text: #dce6f0;
    --text-dim: #7c93ab;
    --accent: #5ba8d4;
    --accent-soft: rgba(91,168,212,0.12);
    --gold: #e3b341;
    --radius: 10px;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(91,168,212,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 40px 24px 60px;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; }

  header{ margin-bottom: 28px; }

  h1{
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin: 24px 0 14px;
    flex-wrap: wrap;
  }

  .search{
    flex: 1;
    min-width: 220px;
    display:flex;
    align-items:center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .search input{
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    width: 100%;
  }
  .search input::placeholder{ color: var(--text-dim); }

  .page-size{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .page-size select{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .filter-group{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
    white-space: nowrap;
  }
  .filter-group input[type="number"]{
    width: 56px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .checkbox-group{
    display:flex;
    align-items:center;
    gap:7px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .checkbox-group:hover{ color: var(--text); }
  .checkbox-group input[type="checkbox"]{
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .table-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  table{ width: 100%; border-collapse: collapse; }

  thead th{
    text-align: left;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 14px 16px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover{ color: var(--text); }
  thead th.num{ text-align: right; }

  .th-inner{ display:inline-flex; align-items:center; gap:6px; }
  .arrow{ font-size: 10px; opacity: 0.35; font-family: var(--mono); }
  thead th.active .arrow{ opacity: 1; color: var(--accent); }

  tbody td{
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody tr:hover{ background: var(--accent-soft); }

  td.num{ font-family: var(--mono); font-size: 13px; color: var(--text-dim); text-align: right; }

  .rec-cell{ display:flex; align-items:center; justify-content:flex-end; gap:6px; }
  .rec-value{ font-family: var(--mono); font-weight: 600; color: var(--gold); }

  .game-link{
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    border-bottom: 1px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .game-link:hover{ color: var(--accent); border-color: var(--accent); }

  .empty, .loading{
    padding: 48px 16px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
  }

  .footer-bar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .pager{ display:flex; align-items:center; gap:6px; }
  .pager button{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .pager button:hover:not(:disabled){ background: var(--accent-soft); color: var(--accent); }
  .pager button:disabled{ opacity: 0.35; cursor: not-allowed; }
  .pager button.active{ background: var(--accent); color: #0d1520; border-color: var(--accent); }
  .pager .gap{ padding: 0 4px; opacity: 0.5; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Каталог ігор Steam</h1>
  </header>

  <div class="toolbar">
    <div class="search">
      <input id="searchInput" type="text" placeholder="Пошук за назвою...">
    </div>
    <div class="filter-group">
      Макс. локалізацій:
      <input id="maxLocInput" type="number" min="0" value="999">
    </div>
    <label class="checkbox-group">
      <input id="noRuCheckbox" type="checkbox">
      no ru
    </label>
    <div class="page-size">
      Рядків на сторінці:
      <select id="pageSizeSelect">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="tableBody">
        <tr><td class="loading" colspan="4">Завантаження games.json...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer-bar">
    <div id="statusText">—</div>
    <div class="pager" id="pager"></div>
  </div>

</div>

<script>
  const COLUMNS = [
    { key: 'appid',                  label: 'AppID',       type: 'num' },
    { key: 'name',                   label: 'Назва',       type: 'text' },
    { key: 'recommendations_total',  label: 'Рецензії',    type: 'num' },
    { key: 'reviews_per_day',        label: 'Рец./день',   type: 'num' },
    { key: 'localizations_count',    label: 'Локалізацій', type: 'num' },
  ];

  let allGames = [];
  let filtered = [];
  let sortKey = 'recommendations_total';
  let sortDir = 'desc';
  let currentPage = 1;
  let pageSize = 25;

  const headerRow     = document.getElementById('headerRow');
  const tableBody     = document.getElementById('tableBody');
  const pagerEl       = document.getElementById('pager');
  const statusText    = document.getElementById('statusText');
  const searchInput   = document.getElementById('searchInput');
  const pageSizeSel   = document.getElementById('pageSizeSelect');
  const maxLocInput   = document.getElementById('maxLocInput');
  const noRuCheckbox  = document.getElementById('noRuCheckbox');

  function buildHeader() {
    headerRow.innerHTML = '';
    COLUMNS.forEach(col => {
      const th = document.createElement('th');
      th.dataset.key = col.key;
      if (col.type === 'num') th.classList.add('num');
      th.innerHTML = `<span class="th-inner">${col.label}<span class="arrow">${sortIndicator(col.key)}</span></span>`;
      th.addEventListener('click', () => {
        if (sortKey === col.key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = col.key;
          sortDir = col.type === 'num' ? 'desc' : 'asc';
        }
        currentPage = 1;
        applySort();
        render();
      });
      if (col.key === sortKey) th.classList.add('active');
      headerRow.appendChild(th);
    });
  }

  function sortIndicator(key) {
    if (key !== sortKey) return '↕';
    return sortDir === 'asc' ? '↑' : '↓';
  }

  function applySort() {
    const col = COLUMNS.find(c => c.key === sortKey);
    const dir = sortDir === 'asc' ? 1 : -1;
    filtered.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (col.type === 'num') {
        va = Number(va) || 0;
        vb = Number(vb) || 0;
        return (va - vb) * dir;
      }
      va = (va ?? '').toString().toLowerCase();
      vb = (vb ?? '').toString().toLowerCase();
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }

  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    const maxLoc = Number(maxLocInput.value) || 0;
    const noRu = noRuCheckbox.checked;

    filtered = allGames.filter(g => {
      if (q && !(g.name || '').toLowerCase().includes(q)) return false;
      if ((g.localizations_count || 0) > maxLoc) return false;
      if (noRu && hasRussian(g)) return false;
      return true;
    });
  }

  function hasRussian(g) {
    return (g.localizations || []).some(l => l.toLowerCase().includes('russian'));
  }

  function formatNumber(n) {
    if (n === null || n === undefined || n === '') return '—';
    return Number(n).toLocaleString('uk-UA');
  }

  function formatDecimal(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return n.toLocaleString('uk-UA', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  function computeReviewsPerDay(g) {
    if (!g.release_date) return null;
    const releaseDate = new Date(g.release_date);
    if (isNaN(releaseDate.getTime())) return null; // напр. "Coming soon", "Q4 2026" -- не дата

    const rawDays = (Date.now() - releaseDate.getTime()) / (1000 * 60 * 60 * 24);
    if (rawDays < 0) return null; // реліз ще попереду

    const daysSinceRelease = Math.max(rawDays, 1); // мінімум 1 день, щоб реліз "сьогодні" не давав завищене число
    const total = Number(g.recommendations_total) || 0;
    return total / daysSinceRelease;
  }

  function steamUrl(appid, name) {
    const slug = (name || '').trim().replace(/[^a-zA-Z0-9]+/g, '_');
    return `https://store.steampowered.com/app/${appid}/${encodeURIComponent(slug)}/`;
  }

  function render() {
    buildHeader();

    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;

    tableBody.innerHTML = '';

    if (total === 0) {
      tableBody.innerHTML = `<tr><td class="empty" colspan="${COLUMNS.length}">Нічого не знайдено</td></tr>`;
    } else {
      const start = (currentPage - 1) * pageSize;
      const pageItems = filtered.slice(start, start + pageSize);

      pageItems.forEach(g => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="num">${g.appid}</td>
          <td>
            <a class="game-link" href="${steamUrl(g.appid, g.name)}" target="_blank" rel="noopener noreferrer">${escapeHtml(g.name || '')}</a>
          </td>
          <td class="num">
            <span class="rec-cell"><span class="rec-value">${formatNumber(g.recommendations_total)}</span></span>
          </td>
          <td class="num">${formatDecimal(g.reviews_per_day)}</td>
          <td class="num">${g.localizations_count}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    statusText.textContent = total === 0
      ? '0 записів'
      : `Показано ${Math.min(total, (currentPage - 1) * pageSize + 1)}–${Math.min(total, currentPage * pageSize)} з ${total}`;

    renderPager(totalPages);
  }

  function renderPager(totalPages) {
    pagerEl.innerHTML = '';

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '← Назад';
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener('click', () => { currentPage--; render(); });
    pagerEl.appendChild(prevBtn);

    const pageNumbers = getPageNumbers(currentPage, totalPages);
    pageNumbers.forEach(p => {
      if (p === '...') {
        const span = document.createElement('span');
        span.className = 'gap';
        span.textContent = '…';
        pagerEl.appendChild(span);
      } else {
        const btn = document.createElement('button');
        btn.textContent = p;
        if (p === currentPage) btn.classList.add('active');
        btn.addEventListener('click', () => { currentPage = p; render(); });
        pagerEl.appendChild(btn);
      }
    });

    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'Вперед →';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener('click', () => { currentPage++; render(); });
    pagerEl.appendChild(nextBtn);
  }

  function getPageNumbers(current, total) {
    const delta = 1;
    const range = [];
    for (let i = Math.max(1, current - delta); i <= Math.min(total, current + delta); i++) range.push(i);
    if (range[0] > 1) { range.unshift('...'); range.unshift(1); }
    if (range[range.length - 1] < total) { range.push('...'); range.push(total); }
    return range;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  searchInput.addEventListener('input', () => {
    currentPage = 1;
    applyFilter();
    applySort();
    render();
  });

  maxLocInput.addEventListener('input', () => {
    currentPage = 1;
    applyFilter();
    applySort();
    render();
  });

  noRuCheckbox.addEventListener('change', () => {
    currentPage = 1;
    applyFilter();
    applySort();
    render();
  });

  pageSizeSel.addEventListener('change', () => {
    pageSize = Number(pageSizeSel.value);
    currentPage = 1;
    render();
  });

  fetch('games.json')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      allGames = data
        .filter(g => g.type === 'game')
        .map(g => ({
          ...g,
          localizations_count: Array.isArray(g.localizations) ? g.localizations.length : 0,
          reviews_per_day: computeReviewsPerDay(g),
        }));
      applyFilter();
      applySort();
      render();
    })
    .catch(err => {
      tableBody.innerHTML = `<tr><td class="empty" colspan="${COLUMNS.length}">
        Не вдалося завантажити games.json (${err.message}).<br>
        Якщо ви відкрили файл напряму (file://), запустіть локальний сервер:<br>
        <code>python -m http.server</code> і відкрийте http://localhost:8000/games.html
      </td></tr>`;
      statusText.textContent = 'Помилка завантаження';
    });
</script>
</body>
</html>
